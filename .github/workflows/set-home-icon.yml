name: Set Home Screen Icon

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  set-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Home-Screen-Icon und Mobile Layout anwenden
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import base64

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          if 'PBT-HOME-ICON-V1' not in text:
              injection = '''<!-- PBT-HOME-ICON-V1 -->
          <meta name="theme-color" content="#ffffff">
          <meta name="apple-mobile-web-app-title" content="Reifenservice">
          <meta name="apple-mobile-web-app-capable" content="yes">
          <script>
          (() => {
            const installPbtIcon = () => {
              const logo = document.querySelector('.auth-brand .logo') || document.querySelector('.brand-logo-wrap img');
              if (!logo || !logo.src) return;
              ['icon', 'apple-touch-icon'].forEach(rel => {
                let link = document.querySelector(`link[rel="${rel}"][data-pbt-icon]`);
                if (!link) { link = document.createElement('link'); link.rel = rel; link.setAttribute('data-pbt-icon', 'true'); document.head.appendChild(link); }
                link.href = logo.src;
              });
            };
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', installPbtIcon);
            else installPbtIcon();
            window.addEventListener('load', installPbtIcon, { once: true });
          })();
          </script>
          '''
              text = text.replace('</head>', injection + '</head>', 1)

          marker = 'Mobile phone layout v2'
          if marker not in text:
              css_b64 = ''
              css = base64.b64decode(css_b64).decode('utf-8')
              text = text.replace('</style>', css + '\n</style>', 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Änderungen committen
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Keine Änderungen notwendig.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Optimiert mobile Darstellung von Übersicht Kalender und Vorbereiten'
          git push
