name: Fix PBT Home Icon

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-icon:
    if: "!contains(github.event.head_commit.message, '[skip icon]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Build PBT icon and update HTML
        run: |
          python - <<'PY'
          import base64, io, re
          from pathlib import Path
          from PIL import Image, ImageOps

          html_path = Path("index.html")
          html = html_path.read_text(encoding="utf-8")

          m = re.search(r'data:image/png;base64,([^"]+)', html)
          if not m:
              raise SystemExit("Logo data URI not found")

          source = Image.open(io.BytesIO(base64.b64decode(m.group(1)))).convert("RGBA")
          w, h = source.size
          crop = source.crop((0, 0, w, int(h * 0.79)))

          icon = Image.new("RGBA", (180, 180), (255, 255, 255, 255))
          fitted = ImageOps.contain(crop, (170, 145))
          icon.alpha_composite(fitted, ((180 - fitted.width) // 2, (180 - fitted.height) // 2))
          icon.save("apple-touch-icon.png", "PNG", optimize=True)

          # Remove every old dynamic PBT icon installer. The old code used
          # the full logo and therefore put the word RACING back on iOS.
          pattern = re.compile(r'<script>.*?installPbtIcon.*?</script>', re.S)
          html, removed = pattern.subn('', html)
          if removed < 1:
              print("No old dynamic icon installer found; continuing.")

          link = '<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">'
          if 'apple-touch-icon.png?v=3' not in html:
              html = html.replace("</head>", f"  {link}\n</head>", 1)

          html_path.write_text(html, encoding="utf-8")
          print(f"Updated index.html; removed {removed} dynamic icon installer(s).")
          PY

      - name: Update entry-date handling
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          original = html

          replacements = [
              (
                  '<div class="field">\n                  <label for="createdDisplay">Eintrag erstellt am</label>\n                  <input id="createdDisplay" type="date" required>\n                </div>',
                  '<div class="field" id="createdDisplayField">\n                  <label for="createdDisplay">Eintrag erstellt am <span class="required-star">*</span></label>\n                  <input id="createdDisplay" type="date">\n                </div>'
              ),
              (
                  '  if(!(c.licensePlate || "").trim()) missing.push("Kfz-Kennzeichen");',
                  '  if(!(c.licensePlate || "").trim()) missing.push("Kfz-Kennzeichen");\n  if(!(c.createdAt || "").trim()) missing.push("Eintrag erstellt am");'
              ),
              (
                  '    [$("licensePlateField"), $("licensePlate").value.trim() !== ""],',
                  '    [$("licensePlateField"), $("licensePlate").value.trim() !== ""],\n    [$("createdDisplayField"), $("createdDisplay").value.trim() !== ""],'
              ),
              (
                  '  $("changeAppointment").value="";\n  activeTireSeason = next;',
                  '  $("changeAppointment").value="";\n  $("createdDisplay").value="";\n  activeTireSeason = next;'
              ),
              (
                  'notes:$("notes").value.trim(),createdAt:$("createdDisplay").value||todayISO()',
                  'notes:$("notes").value.trim(),createdAt:$("createdDisplay").value||""'
              ),
              (
                  '$("licensePlate").addEventListener("input",updateCompletenessNotice);',
                  '$("licensePlate").addEventListener("input",updateCompletenessNotice);\n$("createdDisplay").addEventListener("input",updateCompletenessNotice);\n$("createdDisplay").addEventListener("change",updateCompletenessNotice);'
              )
          ]

          for old, new in replacements:
              if old not in html:
                  raise SystemExit("Expected code fragment not found:\n" + old)
              html = html.replace(old, new, 1)

          path.write_text(html, encoding="utf-8")
          print("Entry-date handling updated." if html != original else "No changes needed.")
          PY

      - name: Commit icon fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html apple-touch-icon.png
          git diff --cached --quiet && exit 0
          git commit -m "Fix PBT home screen icon [skip icon]"
          git push
