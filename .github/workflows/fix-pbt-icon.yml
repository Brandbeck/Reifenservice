name: Fix PBT Home Icon

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-icon:
    if: "!contains(github.event.head_commit.message, '[skip icon]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Build PBT icon and update HTML
        run: |
          python - <<'PY'
          import base64, io, re
          from pathlib import Path
          from PIL import Image, ImageOps

          html_path = Path("index.html")
          html = html_path.read_text(encoding="utf-8")

          m = re.search(r'data:image/png;base64,([^"]+)', html)
          if not m:
              raise SystemExit("Logo data URI not found")

          source = Image.open(io.BytesIO(base64.b64decode(m.group(1)))).convert("RGBA")
          w, h = source.size
          crop = source.crop((0, 0, w, int(h * 0.79)))

          icon = Image.new("RGBA", (180, 180), (255, 255, 255, 255))
          fitted = ImageOps.contain(crop, (170, 145))
          icon.alpha_composite(fitted, ((180 - fitted.width) // 2, (180 - fitted.height) // 2))
          icon.save("apple-touch-icon.png", "PNG", optimize=True)

          pattern = re.compile(r'<script>.*?installPbtIcon.*?</script>', re.S)
          html, removed = pattern.subn('', html)
          if removed < 1:
              print("No old dynamic icon installer found; continuing.")

          link = '<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">'
          if 'apple-touch-icon.png?v=3' not in html:
              html = html.replace("</head>", f"  {link}\n</head>", 1)

          html_path.write_text(html, encoding="utf-8")
          print(f"Updated index.html; removed {removed} dynamic icon installer(s).")
          PY

      - name: Keep new customer entry date empty and optimize mobile date picker
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          old = 'function normalizeDateValue(value){\n  if(!value) return todayISO();'
          new = 'function normalizeDateValue(value){\n  if(!value) return "";'
          if old in html:
              html = html.replace(old, new, 1)
          else:
              print("normalizeDateValue already fixed; continuing.")

          old = '  $("createdDisplay").value=todayISO();\n  $("modalTitle").textContent="Kunde hinzufügen";'
          new = '  $("createdDisplay").value="";\n  $("modalTitle").textContent="Kunde hinzufügen";'
          if old in html:
              html = html.replace(old, new, 1)
          else:
              print("openNew createdDisplay already fixed; continuing.")

          mobile_css = '''\n/* Mobile: Eintrag erstellt am – gut bedienbarer nativer Datumsauswähler */\n@media(max-width:600px){\n  #createdDisplayField{\n    width:100%;\n    max-width:100%;\n  }\n  #createdDisplay{\n    width:100%;\n    min-height:44px;\n    height:44px;\n    font-size:16px;\n    padding:10px 11px;\n    -webkit-appearance:auto;\n    appearance:auto;\n  }\n}\n'''
          if '/* Mobile: Eintrag erstellt am – gut bedienbarer nativer Datumsauswähler */' not in html:
              html = html.replace('</style>', mobile_css + '</style>', 1)

          path.write_text(html, encoding="utf-8")
          print("New-customer entry date is empty and mobile date picker is optimized.")
          PY

      - name: Commit icon fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html apple-touch-icon.png
          git diff --cached --quiet && exit 0
          git commit -m "Keep entry date empty and optimize mobile date picker [skip icon]"
          git push
