name: Fix PBT Home Icon

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-icon:
    if: "!contains(github.event.head_commit.message, '[skip icon]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Build PBT icon and update HTML
        run: |
          python - <<'PY'
          import base64, io, re
          from pathlib import Path
          from PIL import Image, ImageOps

          html_path = Path("index.html")
          html = html_path.read_text(encoding="utf-8")

          m = re.search(r'data:image/png;base64,([^"]+)', html)
          if not m:
              raise SystemExit("Logo data URI not found")

          source = Image.open(io.BytesIO(base64.b64decode(m.group(1)))).convert("RGBA")
          w, h = source.size
          crop = source.crop((0, 0, w, int(h * 0.79)))

          icon = Image.new("RGBA", (180, 180), (255, 255, 255, 255))
          fitted = ImageOps.contain(crop, (170, 145))
          icon.alpha_composite(fitted, ((180 - fitted.width) // 2, (180 - fitted.height) // 2))
          icon.save("apple-touch-icon.png", "PNG", optimize=True)

          pattern = re.compile(
              r'<script>\s*\(\(\) => \{\s*const (?:source|logo) = '
              r'document\.querySelector\([^)]+\) \|\| '
              r'document\.querySelector\([^)]+\);.*?</script>',
              re.S
          )
          html, removed = pattern.subn('', html, count=2)
          if removed != 2:
              raise SystemExit(f"Expected 2 old icon scripts, removed {removed}")

          link = '<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">'
          if 'apple-touch-icon.png?v=2' not in html:
              html = html.replace("</head>", f"  {link}\n</head>", 1)

          html_path.write_text(html, encoding="utf-8")
          print("Updated index.html and generated apple-touch-icon.png")
          PY

      - name: Commit icon fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html apple-touch-icon.png
          git diff --cached --quiet && exit 0
          git commit -m "Fix PBT home screen icon [skip icon]"
          git push
